<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encargado de Obra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e4e7e9;--sf:#fff;--tx:#1b1f23;--mu:#5d676f;--ac:#f5c400;--on:#1b1f23;--bd:#c5cbd0;--ok:#1e7a46;--wa:#b85f00;--er:#c0392b;--tl:#1b1f23;--tt:#f1f3f4;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171a;--sf:#1e2327;--tx:#eceff1;--mu:#9aa5ad;--bd:#343c43;--ok:#4cc27f;--wa:#f0a040;--er:#f27a6c;--tl:#2a3036;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14171a;--sf:#1e2327;--tx:#eceff1;--mu:#9aa5ad;--bd:#343c43;--ok:#4cc27f;--wa:#f0a040;--er:#f27a6c;--tl:#2a3036;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:4px;background:var(--sf);margin:4px 0 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
label{display:block;font-size:14px;color:var(--mu)}
button{border:1.5px solid var(--bd);background:var(--sf);border-radius:4px;padding:10px 14px;cursor:pointer}
.pr{background:var(--ac);color:var(--on);border:0;font-weight:800;width:100%;margin:8px 0;padding:14px}
.dg{color:var(--er);width:100%;margin-top:10px}
.sm{margin:0 0 12px;padding:6px 10px;font-size:14px}
.band{height:10px;margin:8px 0 14px;background:repeating-linear-gradient(-45deg,var(--ac) 0 12px,#1b1f23 12px 24px)}
.ob{font-size:26px;font-weight:800;border:0;background:none;padding:0;margin:0}
.mu{color:var(--mu);font-size:14px;margin:2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px;text-align:left;font-weight:700;background:var(--tl);color:var(--tt);border:0}
.tile b{font-size:28px;line-height:1.2}
.tile small{opacity:.7;font-weight:400}
.card{background:var(--sf);border:1.5px solid var(--bd);border-left:6px solid var(--st,var(--bd));border-radius:4px;padding:12px;margin:10px 0}
.rw{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bd{font-size:13px;font-weight:700;padding:2px 8px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap}
.ok{color:var(--ok);--st:var(--ok)}.wa{color:var(--wa);--st:var(--wa)}.er{color:var(--er);--st:var(--er)}
.card .bd+*,.card b,.card .mu{color:var(--tx)}.card .mu{color:var(--mu)}
.al{padding:10px 12px;border-left:6px solid currentColor;background:var(--sf);margin:8px 0;font-size:15px;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar h1{font-size:22px;flex:1;margin:0}
img{max-width:100%;border-radius:4px;margin-top:8px}
.ck{display:flex;gap:12px;align-items:center;color:var(--tx);font-size:16px;padding:8px 0}
.ck input{width:22px;height:22px;margin:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.g3 input{margin:0}
.big{font-size:20px;font-weight:800;margin:10px 0 0;color:var(--tx)}
</style></head>
<body><div id="app"></div>
<script src="jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={};try{D=JSON.parse(localStorage.getItem('eo')||'{}')}catch(e){}
const nm=()=>{D.obra=D.obra||'Mi obra';D.r=D.r||{};D.chk=D.chk||{}};nm();
const save=()=>{try{localStorage.setItem('eo',JSON.stringify(D))}catch(e){toast('Memoria llena. Haz una copia de seguridad y elimina fotos antiguas.')}};
const T=()=>new Date().toISOString().slice(0,10);
const dl=d=>d?Math.round((new Date(d)-new Date(T()))/864e5):null;
const col=n=>n<0?'er':n<30?'wa':'ok';
const w=r=>{const a=['seguro','tc2','prl','rea'].map(k=>dl(r[k])).filter(x=>x!=null);return a.length?Math.min(...a):null};
const est={Hecho:'ok',Bloqueado:'er','En curso':'wa',Previsto:'',Recibido:'ok',Pedido:'wa',Incidencia:'er',Abierta:'wa',Cerrada:'ok'};
const M={
parte:{t:'Parte diario',i:'📋',f:[['fecha','Fecha','date'],['clima','Clima','sel',['Soleado','Nublado','Lluvia','Viento','Frío','Calor']],['personal','Personal en obra','num'],['trabajos','Trabajos realizados','mic'],['incid','Incidencias','mic'],['pend','Pendiente para mañana','mic']],h:r=>`${r.fecha}, ${r.clima||''}, ${r.personal||0} personas`,s:r=>r.trabajos,
 cp:(r,o)=>`PARTE DIARIO - ${o}\nFecha: ${r.fecha}\nClima: ${r.clima}. Personal: ${r.personal}\n\nTRABAJOS:\n${r.trabajos}\n\nINCIDENCIAS:\n${r.incid}\n\nPENDIENTE:\n${r.pend}`},
libro:{t:'Libro de órdenes',i:'📒',f:[['fecha','Fecha','date'],['tipo','Tipo','sel',['Orden de DF','Incidencia','Visita','Acuerdo']],['estado','Estado','sel',['Abierta','Cerrada']],['texto','Descripción','mic'],['foto','Foto','img']],h:r=>`${r.fecha}, ${r.tipo||''}`,s:r=>r.texto,b:r=>[est[r.estado],r.estado]},
fotos:{t:'Fotos por zona',i:'📷',f:[['fecha','Fecha','date'],['planta','Planta','text'],['zona','Zona','text'],['nota','Nota','text'],['foto','Foto','img']],h:r=>`${r.planta||''}, ${r.zona||''}`,s:r=>r.nota},
subs:{t:'Subcontratas',i:'🧰',f:[['emp','Empresa','text'],['oficio','Oficio','text'],['seguro','Vence seguro RC','date'],['tc2','Próximo TC2','date'],['prl','Vence formación PRL','date'],['rea','Vence inscripción REA','date']],h:r=>r.emp,s:r=>r.oficio,b:r=>{const n=w(r);return n==null?null:[col(n),n<0?'Caducado':n+' días']}},
hormigon:{t:'Hormigón',i:'🧱',f:[['fecha','Fecha','date'],['elem','Elemento (ej. forjado P2)','text'],['tipo','Tipo','sel',['HA-25','HA-30','HA-35','HM-20']],['m3','Volumen (m³)','num'],['alb','Nº de albarán','text'],['rotura','Rotura de probetas (28 días)','date'],['desenc','Desencofrado previsto','date'],['foto','Foto del albarán','img']],h:r=>`${r.fecha}, ${r.elem||''}`,s:r=>`${r.m3||0} m³ ${r.tipo||''}. Rotura: ${r.rotura||'-'}`,b:r=>{const n=dl(r.desenc);return n!=null&&n<=0?['wa','Desencofrable']:null},
 pre:r=>{if(r.fecha&&!r.rotura){const d=new Date(r.fecha);d.setDate(d.getDate()+28);r.rotura=d.toISOString().slice(0,10)}}},
materiales:{t:'Materiales',i:'🚚',f:[['fecha','Fecha','date'],['mat','Material','text'],['cant','Cantidad','text'],['prov','Proveedor','text'],['alb','Nº de albarán','text'],['estado','Estado','sel',['Pedido','Recibido','Incidencia']],['foto','Foto del albarán','img']],h:r=>r.mat,s:r=>`${r.cant||''} de ${r.prov||''}`,b:r=>[est[r.estado],r.estado]},
horas:{t:'Horas de personal',i:'⏱️',f:[['fecha','Fecha','date'],['trab','Trabajador','text'],['horas','Horas','num'],['tarea','Tarea','text']],h:r=>`${r.fecha}, ${r.trab||''}`,s:r=>`${r.horas||0} h. ${r.tarea||''}`,
 tot:rs=>{const o={};rs.forEach(r=>o[r.trab]=(o[r.trab]||0)+(+r.horas||0));return Object.entries(o).map(([k,v])=>`${k}: ${v} h`).join(', ')||'Sin horas'}},
plan:{t:'Planificación 3 semanas',i:'🗓️',f:[['semana','Semana','sel',['Esta semana','Próxima','Dentro de 2']],['tarea','Tarea','text'],['resp','Responsable','text'],['estado','Estado','sel',['Previsto','En curso','Hecho','Bloqueado']],['bloq','Qué bloquea','text']],h:r=>r.tarea,s:r=>`${r.semana||''}, ${r.resp||''}. ${r.bloq||''}`,b:r=>[est[r.estado],r.estado]}};
const C={'Seguridad diaria':['Redes y barandillas colocadas','Huecos protegidos','Andamios revisados y señalizados','EPI en uso por todo el personal','Orden y limpieza en tajos','Cuadro eléctrico y cables en buen estado','Extintor y botiquín accesibles'],
'Antes de hormigonar':['Replanteo y cotas verificados','Armaduras: diámetros, separación y recubrimientos','Separadores colocados','Encofrado estanco y apuntalado','Pasos de instalaciones dejados','Fondo limpio','Bomba y accesos preparados','Pedido y hora confirmados con la central'],
'Cubierta e impermeabilización':['Soporte limpio y seco','Pendientes comprobadas','Encuentros y remates resueltos','Solapes y soldaduras revisados','Prueba de estanquidad hecha'],
'Instalaciones':['Pasatubos y rozas según planos','Pruebas de presión realizadas','Registros accesibles','Fotos antes de cerrar falsos techos y tabiques']};
let pend=null;
const bar=(t,x)=>`<div class="bar"><button onclick="home()" aria-label="Volver">←</button><h1>${t}</h1>${x||''}</div>`;
const al=()=>{const a=[],s=(D.r.subs||[]).filter(r=>w(r)!=null&&w(r)<30).length,o=(D.r.libro||[]).filter(r=>r.estado=='Abierta').length,b=(D.r.plan||[]).filter(r=>r.estado=='Bloqueado').length;if(s)a.push(['er',s+' subcontrata(s) con documentación vencida o a punto de vencer']);if(o)a.push(['wa',o+' anotaciones abiertas en el libro']);if(b)a.push(['wa',b+' tareas bloqueadas']);return a};
function home(){nm();$('#app').innerHTML=`<input class="ob" value="${h(D.obra)}" onchange="D.obra=this.value;save()" aria-label="Nombre de la obra"><p class="mu">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</p><div class="band"></div>${al().map(x=>`<div class="al ${x[0]}">${h(x[1])}</div>`).join('')}<div class="grid">${Object.keys(M).map(k=>`<button class="tile" onclick="list('${k}')"><b>${M[k].i}</b>${M[k].t}<small>${(D.r[k]||[]).length} registros</small></button>`).join('')}<button class="tile" onclick="emp()"><b>🏢</b>Empresa y logo<small>Para los PDF</small></button><button class="tile" onclick="chk()"><b>✅</b>Checklists</button><button class="tile" onclick="calc()"><b>🧮</b>Calculadoras</button><button class="tile" onclick="bk()"><b>💾</b>Copia de seguridad</button></div>`;scrollTo(0,0)}
function list(k){const m=M[k],rs=(D.r[k]||[]).slice().reverse();$('#app').innerHTML=bar(m.t,`<button class="pr" style="width:auto;margin:0" onclick="abrir('${k}')">Añadir</button>`)+(k=='parte'&&rs.length?`<button class="sm" onclick="pdf('parte',D.r.parte.map(r=>r.id))">Exportar todos a PDF</button>`:'')+(m.tot?`<div class="al">${h(m.tot(rs))}</div>`:'')+(rs.map(r=>{const b=m.b?m.b(r):null;return `<div class="card ${b?b[0]:''}" onclick="abrir('${k}','${r.id}')"><div class="rw"><b>${h(m.h(r))}</b>${b?`<span class="bd ${b[0]}">${h(b[1])}</span>`:''}</div><div class="mu">${h((m.s?m.s(r):'')||'').slice(0,160)}</div>${r.foto?`<img src="${r.foto}" alt="">`:''}</div>`}).join('')||'<p class="mu">Todavía no hay registros. Pulsa Añadir para crear el primero.</p>');scrollTo(0,0)}
function abrir(k,id){const m=M[k],r=(D.r[k]||[]).find(x=>x.id==id)||{};pend=r.foto||null;$('#app').innerHTML=bar(m.t)+m.f.map(([n,l,t,o])=>{const v=r[n]??(n=='fecha'?T():'');let c;if(t=='sel')c=`<select id="f_${n}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;else if(t=='mic')c=`<textarea id="f_${n}" rows="4">${h(v)}</textarea><button class="sm" type="button" onclick="mic('f_${n}',this)">🎤 Dictar</button>`;else if(t=='img')c=`<input type="file" accept="image/*" onchange="pf(this)"><img id="pv" alt="" ${pend?`src="${pend}"`:'hidden'}>`;else c=`<input id="f_${n}" type="${t=='num'?'number':t}" ${t=='num'?'step="any" inputmode="decimal"':''} value="${h(v)}">`;return `<label>${l}${c}</label>`}).join('')+`<button class="pr" onclick="sv('${k}','${id||''}')">Guardar</button>`+(id&&m.cp?`<button class="sm" onclick="cp('${k}','${id}')">Copiar texto del parte</button><button class="sm" style="margin-left:8px" onclick="pdf('parte',['${id}'])">Exportar a PDF</button>`:'')+(id?`<button class="dg" onclick="del('${k}','${id}',this)">Eliminar registro</button>`:'');scrollTo(0,0)}
function sv(k,id){const m=M[k],a=D.r[k]=D.r[k]||[];let r=a.find(x=>x.id==id);if(!r){r={id:Date.now().toString(36)};a.push(r)}m.f.forEach(([n,,t])=>{if(t=='img')r.foto=pend;else r[n]=$('#f_'+n).value});if(m.pre)m.pre(r);save();list(k)}
function del(k,id,b){if(b.dataset.c){D.r[k]=D.r[k].filter(x=>x.id!=id);save();list(k)}else{b.dataset.c=1;b.textContent='Toca otra vez para eliminar'}}
function cp(k,id){const t=M[k].cp(D.r[k].find(x=>x.id==id),D.obra),ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)return toast('Parte copiado');try{navigator.clipboard.writeText(t).then(()=>toast('Parte copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
const toast=t=>{let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';e.className='al';e.style.cssText='position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;border:1.5px solid var(--bd)';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,6000)};
function mic(i,b){const R=window.SpeechRecognition||window.webkitSpeechRecognition,tip='Dictado no disponible aquí. Toca el campo y usa el micrófono del teclado del móvil.';const el=$('#'+i);if(!R){el.focus();return toast(tip)}const r=new R();r.lang='es-ES';r.onstart=()=>{b.textContent='🎤 Escuchando...'};r.onend=()=>{b.textContent='🎤 Dictar'};r.onerror=e=>{el.focus();toast(e.error=='not-allowed'||e.error=='service-not-allowed'?tip:'Error de dictado: '+e.error)};r.onresult=e=>{el.value+=(el.value?' ':'')+e.results[0][0].transcript};try{r.start()}catch(x){el.focus();toast(tip)}}
const pf=async i=>{const f=i.files[0];if(!f)return;pend=await new Promise(ok=>{const rd=new FileReader();rd.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,800/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};m.src=rd.result};rd.readAsDataURL(f)});const p=$('#pv');p.src=pend;p.hidden=false};
function chk(){const y=scrollY;$('#app').innerHTML=bar('Checklists')+Object.entries(C).map(([n,it])=>{const s=D.chk[n]||{},d=it.filter((_,i)=>s[i]).length,c=d==it.length?'ok':d?'wa':'';return `<div class="card ${c}"><div class="rw"><b>${n}</b><span class="bd ${c}">${d} de ${it.length}</span></div>${it.map((x,i)=>`<label class="ck"><input type="checkbox" ${s[i]?'checked':''} onchange="tg('${n}',${i},this.checked)">${x}</label>`).join('')}<button class="sm" onclick="D.chk['${n}']={};save();chk()">Reiniciar</button></div>`}).join('');scrollTo(0,y)}
function tg(n,i,v){D.chk[n]=D.chk[n]||{};D.chk[n][i]=v;save();chk()}
function calc(){const g=(a,b,c)=>`<div class="g3"><input id="${a}1" type="number" inputmode="decimal" placeholder="${b[0]}" oninput="cc()"><input id="${a}2" type="number" inputmode="decimal" placeholder="${b[1]}" oninput="cc()">${c?`<input id="${a}3" type="number" inputmode="decimal" placeholder="${c}" oninput="cc()">`:'<span></span>'}</div>`;$('#app').innerHTML=bar('Calculadoras')+`<div class="card"><b>Hormigón</b>${g('a',['Largo m','Ancho m'],'Espesor m')}<p class="big" id="r1">0 m³</p></div><div class="card"><b>Encofrado lateral</b>${g('b',['Perímetro m','Altura m'])}<p class="big" id="r2">0 m²</p></div><div class="card"><b>Ferralla</b>${g('c',['Volumen m³','Cuantía kg/m³'])}<p class="big" id="r3">0 kg</p><p class="mu">Cuantías habituales: 80 a 120 kg/m³ en forjados y 40 a 70 en cimentación. Confirma con el proyecto.</p></div>`}
function cc(){const n=i=>+$('#'+i).value||0,v=n('a1')*n('a2')*n('a3');$('#r1').textContent=`${v.toFixed(2)} m³, pedir ${(v*1.05).toFixed(2)} m³ con 5 % de merma`;$('#r2').textContent=`${(n('b1')*n('b2')).toFixed(2)} m²`;$('#r3').textContent=`${Math.round(n('c1')*n('c2'))} kg`}
function bk(){$('#app').innerHTML=bar('Copia de seguridad')+`<p class="mu">Los datos se guardan solo en este navegador. Copia este texto a un lugar seguro. Para restaurar, pégalo aquí y pulsa Importar.</p><textarea id="bj" rows="10">${h(JSON.stringify(D))}</textarea><button class="sm" onclick="navigator.clipboard.writeText($('#bj').value).then(()=>toast('Copiado'),()=>toast('Selecciona el texto y cópialo a mano'))">Copiar</button><button class="pr" onclick="try{D=JSON.parse($('#bj').value);save();home()}catch(e){toast('El texto no es una copia válida')}">Importar</button><button class="dg" onclick="if(this.dataset.c){D={};try{localStorage.removeItem('eo')}catch(e){};home()}else{this.dataset.c=1;this.textContent='Toca otra vez para borrar todo'}">Borrar todo</button>`}
const fd=s=>s?s.split('-').reverse().join('/'):'-';
const appLogo=()=>{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');x.fillStyle='#f5c400';x.fillRect(0,0,200,200);x.fillStyle='#1b1f23';x.fillRect(0,150,200,50);x.fillStyle='#f5c400';for(let i=-50;i<200;i+=40){x.beginPath();x.moveTo(i,200);x.lineTo(i+20,200);x.lineTo(i+50,150);x.lineTo(i+30,150);x.fill()}x.fillStyle='#1b1f23';x.font='800 88px system-ui,sans-serif';x.textAlign='center';x.fillText('EO',100,115);return c.toDataURL('image/png')};
let tl=null;
const lg=async i=>{const f=i.files[0];if(!f)return;tl=await new Promise(ok=>{const rd=new FileReader();rd.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,300/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=Math.round(m.width*k);c.height=Math.round(m.height*k);c.getContext('2d').drawImage(m,0,0,c.width,c.height);ok({logo:c.toDataURL('image/png'),w:c.width,h:c.height})};m.src=rd.result};rd.readAsDataURL(f)});$('#lp').src=tl.logo;$('#lt').textContent='Logo cargado. Pulsa Guardar.'};
function se(){D.emp=D.emp||{};D.emp.nombre=$('#en').value;if(tl){Object.assign(D.emp,tl);tl=null}save();toast('Datos de empresa guardados');home()}
function emp(){const e=D.emp||{};tl=null;$('#app').innerHTML=bar('Empresa y logo')+`<label>Nombre de la empresa<input id="en" value="${h(e.nombre||'')}"></label><label>Logo de la empresa<input type="file" accept="image/*" onchange="lg(this)"></label><img id="lp" alt="Logo" style="max-height:120px" src="${e.logo||appLogo()}"><p class="mu" id="lt">${e.logo?'Se usará tu logo en los PDF.':'Sin logo propio: se usará el logo de la aplicación.'}</p><button class="pr" onclick="se()">Guardar</button>${e.logo?`<button class="dg" onclick="D.emp.logo=null;save();emp()">Quitar logo</button>`:''}`;scrollTo(0,0)}
function hdr(d){const e=D.emp||{},o=!!e.logo,w=o?e.w:200,g=o?e.h:200,k=Math.min(30/w,20/g);d.addImage(o?e.logo:appLogo(),'PNG',15,10,w*k,g*k);d.setFont('helvetica','bold');d.setFontSize(16);d.setTextColor(27,31,35);d.text(e.nombre||'Encargado de Obra',50,20);d.setFont('helvetica','normal');d.setFontSize(10);d.text(D.obra||'',50,27);d.setDrawColor(27,31,35);d.setLineWidth(.6);d.line(15,33,195,33)}
function page(d,r){hdr(d);let y=44;d.setFont('helvetica','bold');d.setFontSize(14);d.text('PARTE DIARIO',15,y);y+=8;d.setFont('helvetica','normal');d.setFontSize(10);d.text(`Fecha: ${fd(r.fecha)}     Clima: ${r.clima||'-'}     Personal en obra: ${r.personal||0}`,15,y);y+=10;[['Trabajos realizados',r.trabajos],['Incidencias',r.incid],['Pendiente para mañana',r.pend]].forEach(([t,x])=>{d.setFont('helvetica','bold');d.setFontSize(11);d.text(t,15,y);y+=6;d.setFont('helvetica','normal');d.setFontSize(10);d.splitTextToSize(x||'-',180).forEach(l=>{if(y>270){d.addPage();hdr(d);y=44}d.text(l,15,y);y+=5});y+=6});if(y>250){d.addPage();hdr(d);y=44}d.line(15,y+22,85,y+22);d.text('Firma del encargado',15,y+27);d.setFontSize(8);d.text('Generado con Encargado de Obra',15,288)}
async function pdf(k,ids){const J=window.jspdf;if(!J)return toast('No se pudo cargar el generador de PDF. Revisa tu conexión.');const rs=(D.r[k]||[]).filter(r=>ids.includes(r.id)).sort((a,b)=>(a.fecha||'')>(b.fecha||'')?1:-1);if(!rs.length)return toast('No hay partes para exportar');try{const d=new J.jsPDF({unit:'mm',format:'a4'});rs.forEach((r,i)=>{if(i)d.addPage();page(d,r)});const fn='parte-'+(rs.length>1?'todos':rs[0].fecha||'obra')+'.pdf',P=window.Capacitor&&window.Capacitor.Plugins;if(P&&P.Filesystem&&P.Share){const f=await P.Filesystem.writeFile({path:fn,data:d.output('datauristring').split(',')[1],directory:'CACHE'});await P.Share.share({title:fn,url:f.uri,dialogTitle:'Guardar o enviar el parte'});return}const dn=window.claude&&await window.claude.use('downloads');if(!dn)return toast('La descarga no está disponible en esta vista. Abre el enlace en el navegador.');await dn.save({filename:'parte-'+(rs.length>1?'todos':rs[0].fecha||'obra')+'.pdf',data:d.output('blob')})}catch(e){if(!e||e.code!='declined')toast('No se pudo crear el PDF')}}
home();
</script></body></html>
