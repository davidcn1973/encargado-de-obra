name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install @capacitor/camera@6 @capacitor/app@6
      - run: npm install pdfjs-dist@3.11.174 dxf-parser@1.1.2
      - run: cp node_modules/jspdf/dist/jspdf.umd.min.js www/
      - name: Copiar lectores de PDF y DXF
        run: |
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/
          cp -r node_modules/pdfjs-dist/standard_fonts www/standard_fonts
          cp node_modules/dxf-parser/dist/dxf-parser.js www/
      - run: npx cap add android
      - name: Permiso de camara
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n CAMERA android/app/src/main/AndroidManifest.xml
      - name: Icono y pantalla de inicio
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*' -type f -delete
          find $R -name 'splash.png' -type f -delete
          cp -r android-res/. $R/
          test -f $R/mipmap-xxxhdpi/ic_launcher.png
          test -f $R/drawable/splash.xml
          ls $R/mipmap-xxxhdpi
      - run: npx cap sync android
      - name: Firma fija (permite actualizar encima)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: encargado-de-obra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
