name: Publicar version web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install pdfjs-dist@3.11.174 dxf-parser@1.1.2
      - name: Preparar la carpeta web
        run: |
          mkdir web
          cp -r www/. web/
          cp node_modules/jspdf/dist/jspdf.umd.min.js web/
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js web/
          cp -r node_modules/pdfjs-dist/standard_fonts web/standard_fonts
          cp node_modules/dxf-parser/dist/dxf-parser.js web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
